services:
  auth-service:
    build: ../apps/auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-sharing}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ChangeMe123!}
    ports:
      - "8080:8080"
    volumes:
      - auth_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  survey-service:
    build: ../apps/survey-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-sharing}
      AUTH_URL: http://auth-service:8080
    ports:
      - "8081:8081"
    volumes:
      - survey_data:/data
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  auth_data:
  survey_data:
